name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.20.0, 24.x]
    env:
      LABOURCHAIN_CORE_PLUGINS_MODULE: ${{ github.workspace }}/.core/core-plugins/lib/index.js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:coverage

      - name: checkout Core Plugin tooling
        uses: actions/checkout@v4
        with:
          repository: labourchain/core-plugins
          ref: 7d4529a7fd293301ba21c94e82ad0d91844bab73
          path: .core/core-plugins
      - name: build Core Plugin tooling
        run: |
          pnpm --dir .core/core-plugins install --no-frozen-lockfile
          pnpm --dir .core/core-plugins run build

      - run: pnpm run build
      - run: pnpm run test:bin
      - name: verify publish tarball
        run: pnpm run package:check
